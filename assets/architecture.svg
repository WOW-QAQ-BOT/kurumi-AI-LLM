<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">AI-LLM 系统架构</title>
  <desc id="desc">展示时崎狂三角色聊天项目的交互入口、人物上下文、双引擎推理、受限 Agent 执行链、权限控制与外部资源。</desc>

  <defs>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#541827"/>
      <stop offset="0.55" stop-color="#8d2942"/>
      <stop offset="1" stop-color="#b66a32"/>
    </linearGradient>
    <linearGradient id="agent-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f4"/>
      <stop offset="1" stop-color="#fff8eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#2c1720" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b3b42"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a42b45"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d60"/>
    </marker>
    <style>
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill: #30252a; }
      .title { font-size: 23px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #685860; }
      .small { font-size: 15px; fill: #74666c; }
      .chip { font-size: 14px; font-weight: 600; }
      .layer { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
      .connector { fill: none; stroke: #4b3b42; stroke-width: 3; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #77666e; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .connector-red { fill: none; stroke: #a42b45; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow-red); }
      .connector-green { fill: none; stroke: #2e7d60; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow-green); }
      .node { stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1020" rx="28" fill="#fffafc"/>
  <rect x="20" y="20" width="1560" height="980" rx="24" fill="none" stroke="#eadce1" stroke-width="2"/>

  <!-- Header -->
  <path d="M44 20 H1556 A24 24 0 0 1 1580 44 V112 H20 V44 A24 24 0 0 1 44 20 Z" fill="url(#header-gradient)"/>
  <text class="text" x="70" y="67" font-size="32" font-weight="700" style="fill:#ffffff">AI-LLM 系统架构</text>
  <text class="text" x="70" y="94" font-size="17" opacity="0.88" style="fill:#ffffff">时崎狂三角色聊天 · 本地 / 云端双引擎 · 受限 Agent</text>
  <g transform="translate(1280 48)">
    <circle cx="18" cy="18" r="18" fill="#e6b957"/>
    <circle cx="18" cy="18" r="12" fill="none" stroke="#6d2639" stroke-width="2"/>
    <path d="M18 7 V18 L26 23" fill="none" stroke="#6d2639" stroke-width="2.5" stroke-linecap="round"/>
    <text class="text" x="50" y="24" font-size="19" font-weight="700" style="fill:#ffffff">Kurumi Agent</text>
  </g>

  <!-- Interaction and context layer -->
  <rect x="45" y="135" width="1510" height="210" rx="20" fill="#f7f4f6" stroke="#e6dce0" stroke-width="2"/>
  <rect x="65" y="151" width="150" height="34" rx="17" fill="#e7dce1"/>
  <text class="text layer" x="140" y="174" text-anchor="middle">交互与上下文</text>

  <g>
    <rect class="node" x="85" y="218" width="190" height="76" rx="18" fill="#ffffff" stroke="#6f5b65"/>
    <circle cx="125" cy="248" r="14" fill="#8d2942"/>
    <path d="M103 281 C107 261 143 261 147 281" fill="#8d2942"/>
    <text class="text title" x="210" y="254" text-anchor="middle">用户</text>
    <text class="text small" x="210" y="278" text-anchor="middle">输入任务 / 对话</text>
  </g>

  <g>
    <rect class="node" x="330" y="183" width="260" height="72" rx="16" fill="#eef5ff" stroke="#4c77a8"/>
    <text class="text title" x="460" y="214" text-anchor="middle">桌面聊天 UI</text>
    <text class="text small" x="460" y="239" text-anchor="middle">UI.py · PySide6</text>
    <rect class="node" x="330" y="273" width="260" height="52" rx="16" fill="#f3f7fc" stroke="#6e879f"/>
    <text class="text" x="460" y="306" text-anchor="middle" font-size="19" font-weight="700">CLI · chat_kurumi.py</text>
  </g>

  <g>
    <rect class="node" x="685" y="176" width="300" height="150" rx="20" fill="#f7f0ff" stroke="#8059a7"/>
    <text class="text title" x="835" y="211" text-anchor="middle">统一人物上下文</text>
    <rect x="712" y="231" width="116" height="34" rx="17" fill="#e9dbf7"/>
    <text class="text chip" x="770" y="253" text-anchor="middle">人物设定</text>
    <rect x="842" y="231" width="116" height="34" rx="17" fill="#e9dbf7"/>
    <text class="text chip" x="900" y="253" text-anchor="middle">长期记忆</text>
    <rect x="754" y="275" width="162" height="34" rx="17" fill="#eee5f8"/>
    <text class="text chip" x="835" y="297" text-anchor="middle">知识库 RAG</text>
  </g>

  <g>
    <rect class="node" x="1100" y="211" width="300" height="86" rx="20" fill="#fff7e9" stroke="#bd8431"/>
    <text class="text title" x="1250" y="244" text-anchor="middle">推理引擎路由</text>
    <text class="text subtitle" x="1250" y="274" text-anchor="middle">显存 / 配置 / Agent 开关</text>
  </g>

  <path class="connector" d="M275 256 H302 V219 H330"/>
  <path class="connector-soft" d="M275 256 H302 V299 H330"/>
  <path class="connector" d="M590 219 H685"/>
  <path class="connector-soft" d="M590 299 H640 V270 H685"/>
  <path class="connector" d="M985 251 H1100"/>

  <!-- Inference layer -->
  <rect x="45" y="370" width="1510" height="205" rx="20" fill="#f7f4f6" stroke="#e6dce0" stroke-width="2"/>
  <rect x="65" y="386" width="126" height="34" rx="17" fill="#e7dce1"/>
  <text class="text layer" x="128" y="409" text-anchor="middle">推理引擎</text>

  <g>
    <rect class="node" x="150" y="448" width="320" height="96" rx="20" fill="#edf9f3" stroke="#3d8a6d"/>
    <text class="text title" x="310" y="482" text-anchor="middle">本地推理</text>
    <text class="text subtitle" x="310" y="510" text-anchor="middle">Qwen3-4B + Kurumi LoRA</text>
    <text class="text small" x="310" y="532" text-anchor="middle">4-bit QLoRA / bf16</text>
  </g>
  <g>
    <rect class="node" x="640" y="448" width="320" height="96" rx="20" fill="#eef5ff" stroke="#4c77a8"/>
    <text class="text title" x="800" y="482" text-anchor="middle">DeepSeek 对话</text>
    <text class="text subtitle" x="800" y="510" text-anchor="middle">API Chat Worker</text>
    <text class="text small" x="800" y="532" text-anchor="middle">云端普通聊天 / 记忆整理</text>
  </g>
  <g>
    <rect class="node" x="1130" y="448" width="320" height="96" rx="20" fill="#fff0f3" stroke="#a42b45"/>
    <text class="text title" x="1290" y="482" text-anchor="middle">DeepSeek Agent</text>
    <text class="text subtitle" x="1290" y="510" text-anchor="middle">Responses API + Tools</text>
    <text class="text small" x="1290" y="532" text-anchor="middle">网页搜索 · 文件 · 系统操作</text>
  </g>

  <path class="connector" d="M1250 297 V403 H310 V448"/>
  <path class="connector" d="M800 403 V448"/>
  <path class="connector-red" d="M1250 403 H1290 V448"/>

  <!-- Controlled Agent layer -->
  <rect x="45" y="600" width="1510" height="365" rx="22" fill="url(#agent-gradient)" stroke="#d9b1bb" stroke-width="2"/>
  <rect x="65" y="616" width="168" height="34" rx="17" fill="#f0dfe4"/>
  <text class="text layer" x="149" y="639" text-anchor="middle">受控 Agent 执行链</text>

  <g>
    <rect class="node" x="90" y="686" width="220" height="82" rx="18" fill="#ffffff" stroke="#8d5465"/>
    <text class="text title" x="200" y="720" text-anchor="middle">AgentController</text>
    <text class="text small" x="200" y="747" text-anchor="middle">Qt 信号 · 生命周期 · 取消</text>
  </g>
  <g>
    <rect class="node" x="370" y="686" width="220" height="82" rx="18" fill="#ffffff" stroke="#8d5465"/>
    <text class="text title" x="480" y="720" text-anchor="middle">AgentRunner</text>
    <text class="text small" x="480" y="747" text-anchor="middle">有界循环 · 预算 · 事件</text>
  </g>
  <g>
    <rect class="node" x="660" y="656" width="280" height="112" rx="18" fill="#eef5ff" stroke="#4c77a8"/>
    <text class="text title" x="800" y="691" text-anchor="middle">模型适配器</text>
    <text class="text subtitle" x="800" y="719" text-anchor="middle">DeepSeek Responses</text>
    <text class="text small" x="800" y="745" text-anchor="middle">函数调用 · 引用来源 · 网页搜索</text>
  </g>
  <g>
    <rect class="node" x="660" y="820" width="280" height="110" rx="18" fill="#fff7e9" stroke="#bd8431"/>
    <text class="text title" x="800" y="854" text-anchor="middle">PermissionPolicy</text>
    <text class="text subtitle" x="800" y="882" text-anchor="middle">ALLOW · ASK · DENY</text>
    <text class="text small" x="800" y="908" text-anchor="middle">规范路径 · 指纹 · 单次审批</text>
  </g>
  <g>
    <rect class="node" x="1010" y="730" width="220" height="96" rx="18" fill="#fff0f3" stroke="#a42b45"/>
    <text class="text title" x="1120" y="766" text-anchor="middle">Tool Executor</text>
    <text class="text subtitle" x="1120" y="795" text-anchor="middle">严格参数与审批绑定</text>
  </g>

  <g>
    <rect class="node" x="1290" y="644" width="220" height="70" rx="16" fill="#eef5ff" stroke="#4c77a8"/>
    <text class="text" x="1400" y="675" text-anchor="middle" font-size="19" font-weight="700">公开网页</text>
    <text class="text small" x="1400" y="698" text-anchor="middle">搜索 / 来源</text>
    <rect class="node" x="1290" y="741" width="220" height="70" rx="16" fill="#edf9f3" stroke="#3d8a6d"/>
    <text class="text" x="1400" y="772" text-anchor="middle" font-size="19" font-weight="700">本地文件</text>
    <text class="text small" x="1400" y="795" text-anchor="middle">D:\Desktop\ 允许根</text>
    <rect class="node" x="1290" y="838" width="220" height="70" rx="16" fill="#f5f1f7" stroke="#8059a7"/>
    <text class="text" x="1400" y="869" text-anchor="middle" font-size="19" font-weight="700">Windows 系统</text>
    <text class="text small" x="1400" y="892" text-anchor="middle">应用 / 文件 / 系统信息</text>
  </g>

  <g>
    <rect class="node" x="90" y="836" width="220" height="82" rx="18" fill="#f5f1f7" stroke="#8059a7"/>
    <text class="text" x="200" y="870" text-anchor="middle" font-size="19" font-weight="700">Windows 凭据管理器</text>
    <text class="text small" x="200" y="897" text-anchor="middle">API Key 不进入模型参数</text>
  </g>
  <g>
    <rect class="node" x="370" y="836" width="220" height="82" rx="18" fill="#f2f3f5" stroke="#6f737a"/>
    <text class="text" x="480" y="870" text-anchor="middle" font-size="19" font-weight="700">AgentStore</text>
    <text class="text small" x="480" y="897" text-anchor="middle">SQLite 脱敏审计 / 来源</text>
  </g>

  <path class="connector-red" d="M1290 544 V610 H280 V670 H200 V686"/>
  <path class="connector" d="M310 727 H370"/>
  <path class="connector" d="M590 711 H660"/>
  <path class="connector-soft" d="M660 742 H590"/>
  <path class="connector" d="M480 768 V800 H800 V820"/>
  <path class="connector-red" d="M940 875 H975 V778 H1010"/>
  <path class="connector-green" d="M1010 808 H980 V948 H480 V918"/>
  <path class="connector-soft" d="M800 656 V624 H1400 V644"/>
  <path class="connector" d="M1230 778 H1260 V776 H1290"/>
  <path class="connector" d="M1230 778 H1260 V873 H1290"/>
  <path class="connector-soft" d="M310 877 H330 V790 H630 V748 H660"/>
  <path class="connector-soft" d="M480 768 V836"/>

  <text class="text small" x="624" y="697" text-anchor="middle">请求</text>
  <text class="text small" x="624" y="755" text-anchor="middle">模型回合</text>
  <text class="text small" x="862" y="944" text-anchor="middle" fill="#2e7d60">ToolResult 与审计事件</text>

  <!-- Legend -->
  <g transform="translate(1040 940)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#4b3b42" stroke-width="3"/>
    <text class="text small" x="52" y="6">主要数据流</text>
    <line x1="178" y1="0" x2="220" y2="0" stroke="#a42b45" stroke-width="3" stroke-dasharray="8 6"/>
    <text class="text small" x="230" y="6">受审批操作</text>
    <line x1="356" y1="0" x2="398" y2="0" stroke="#2e7d60" stroke-width="3" stroke-dasharray="8 6"/>
    <text class="text small" x="408" y="6">结果 / 审计</text>
  </g>
</svg>
